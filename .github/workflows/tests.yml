name: Tests

on:
  push:
    branches: ["main", "master", "claude/**", "programmer/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the serial-console image of each build booted in QEMU (tests/run.sh), as `make test` does on a developer's machine
  qemu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib clang nasm gcc-mingw-w64-i686 g++-mingw-w64-i686 \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 dosfstools mtools openssl python3-cryptography \
            python3-numpy qemu-system-x86 p7zip-full
      - name: Build without warnings
        run: |
          make ARCH=${{ matrix.arch }} SERIAL=1 2>&1 | tee build.log
          ! grep -i -E 'warning|error' build.log
      - name: make test
        run: make ARCH=${{ matrix.arch }} test

  # host tests that need no virtual machine: the assistant's engine, the crypto and the parser fuzzers
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang python3-numpy python3-cryptography python3-pil
      - name: make test-ai
        run: make test-ai
      - name: make test-crypto
        run: make test-crypto
      - name: make fuzz
        run: make fuzz FUZZ_SECONDS=60
